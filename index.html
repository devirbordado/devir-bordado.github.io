<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devir Bordado — Em gestação</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MRJ64TZNZ8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MRJ64TZNZ8');
    </script>

    <style>
        /* --- RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #F5EFE3; /* Papiro */
            font-family: 'Times New Roman', 'Georgia', serif;
            padding: 1.5rem;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            text-align: center;
            max-width: 600px;
        }

        /* --- PULSO (batimento cardíaco) --- */
        .pulse-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .heartbeat {
            width: 48px;
            height: 48px;
            position: relative;
        }

        /* Símbolo do coração */
        .heartbeat::before,
        .heartbeat::after {
            content: '';
            position: absolute;
            top: 0;
            width: 24px;
            height: 38px;
            background: #951822;
            border-radius: 24px 24px 0 0;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .heartbeat::before {
            left: 24px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heartbeat::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
            animation-name: pulse-after;
        }

        /* Animação do pulso - lado esquerdo */
        @keyframes pulse {
            0% {
                transform: rotate(-45deg) scale(0.95);
                background: #951822;
            }
            14% {
                transform: rotate(-45deg) scale(1.12);
                background: #B84A5A;
            }
            28% {
                transform: rotate(-45deg) scale(0.95);
                background: #951822;
            }
            42% {
                transform: rotate(-45deg) scale(1.0);
                background: #951822;
            }
            100% {
                transform: rotate(-45deg) scale(0.95);
                background: #951822;
            }
        }

        /* Animação do pulso - lado direito */
        @keyframes pulse-after {
            0% {
                transform: rotate(45deg) scale(0.95);
                background: #951822;
            }
            14% {
                transform: rotate(45deg) scale(1.12);
                background: #B84A5A;
            }
            28% {
                transform: rotate(45deg) scale(0.95);
                background: #951822;
            }
            42% {
                transform: rotate(45deg) scale(1.0);
                background: #951822;
            }
            100% {
                transform: rotate(45deg) scale(0.95);
                background: #951822;
            }
        }

        /* --- TEXTO --- */
        .frase {
            color: #74415B; /* Magenta apagado */
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            line-height: 1.5;
            margin-bottom: 1.2rem;
        }

        .frase span {
            display: inline-block;
            animation: respira 4s ease-in-out infinite;
        }

        @keyframes respira {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .assinatura {
            color: #B8A893;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 1.8rem;
            border-top: 1px solid #DDD1BE;
            padding-top: 1.8rem;
        }

        /* --- RESPONSIVO --- */
        @media (max-width: 480px) {
            .frase {
                font-size: 1.2rem;
                letter-spacing: 0.08em;
            }
            .heartbeat {
                width: 36px;
                height: 36px;
            }
            .heartbeat::before,
            .heartbeat::after {
                width: 18px;
                height: 28px;
                border-radius: 18px 18px 0 0;
            }
            .heartbeat::before {
                left: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Pulso -->
        <div class="pulse-container">
            <div class="heartbeat"></div>
        </div>

        <!-- Frase -->
        <p class="frase">
            <span>Este espaço está em gestação.</span><br>
            <span>Espere conosco.</span>
        </p>

        <!-- Assinatura mínima -->
        <div class="assinatura">
            Devir Bordado
        </div>

    </div>

</body>
</html>
