name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  # Reconstrói todo dia para que os textos com data futura apareçam sozinhos.
  # O agendamento do GitHub atrasa por horas e às vezes é descartado, então há
  # três horários (minutos "quebrados" sofrem menos atraso que as horas cheias):
  #   03:23, 06:41 e 09:17 (Brasília). O disparo preciso, das 02:55, é feito pelo
  # Worker "devir-disparo" do Cloudflare, via workflow_dispatch.
  schedule:
    - cron: "23 6 * * *"
    - cron: "41 9 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Sao_Paulo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://devirbordado.space/"
      - name: Página 404 na raiz (o GitHub Pages só procura /404.html)
        run: cp public/pt-br/404.html public/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
